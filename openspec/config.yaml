schema: spec-driven

context: |
  Borough 商家 AI 助手 —— Python 3.12 + FastAPI + LangGraph 后端，Vue 3 + TypeScript 前端，
  PostgreSQL 主库，Railway 部署。面向电商平台商家的对外 Data Agent（B2B SaaS）：商家侧用演示
  Token 鉴权做自然语言经营数据查询，运营侧走独立 X-Admin-Token 管理知识库与 Chat BI 看板。

  不可违反的规则（完整定义见仓库根目录 AGENTS.md §二，冲突时以 AGENTS.md 原文为准）：
  - R1 面向用户的文案默认中文，代码标识符用英文。
  - R2 未经用户明确许可不得执行 git commit / push / tag、gh pr create / merge，不得
    git reset --hard / git clean 等丢弃改动的命令。
  - R3 执行**真实或可能产生费用**的 LLM 调用（真实聊天接口、OCR、日报、记忆压缩、批量本地化，
    以及任何走真实 LLM_API_KEY 的路径）前，必须先说明会调用什么接口、预计调用次数、使用什么
    模型、是否产生费用，取得用户明确同意后才能执行。已确认走 mock/fake LLM、不写生产数据、
    使用可丢弃测试数据的本地操作（pytest、npm run test、lint、typecheck、mock e2e、OpenAPI
    导出）无需费用审批；无法确认时不擅自运行。自动化测试必须 mock LLM，真实调用属于另行授权
    的人工验收，不加入默认测试套件。同一接口/模型/次数或费用上限范围内的授权在本次会话内继续
    有效，换模型或超出上限须重新取得同意；泛化的「执行这个计划」不构成费用授权。
  - R4 LLM 只能输出经 Pydantic 校验的结构化查询意图，绝不允许生成或执行任意 SQL；表名列名
    来自白名单，值全部参数绑定，日期范围/最大行数/商家范围由后端强制限制，查询前自动注入
    merchant_id，日志不记录隐私字段与完整查询结果。
  - R5 一切经营数据、会话、附件、记忆、反馈都必须按 merchant_id 隔离；不信任前端直传的商家
    编号，必须从已验证身份中获取或校验。
  - R6 密钥只能来自环境变量 / Railway Variables，不得进代码；DATABASE_URL、LLM_API_KEY、
    ADMIN_TOKEN 等完整清单及例外（DEMO 演示 Token、VIEWER_TOKEN）见 AGENTS.md §二 R6。
  - R7 数据库 / 知识库 / LLM / OCR / 对象存储不可用时可以降级，但必须在 API 字段与页面上
    显式可见（degraded、degraded_reason、quality_status、analysis_sources 等），不得把兜底
    包装成真实模型分析。
  - R8 `yshopping-merchant-ai 4/` 参考项目只读，禁止编辑、重命名、新建文件或对其做任何格式化
    / 依赖升级 / 重跑测试；需要复用其中代码或资源，先复制到新项目路径再改。
  - R9 本项目目标是把参考项目 1:1 还原为 Python + TypeScript；PRD、开发计划与参考项目实际
    实现冲突时改我们的文档去跟随参考项目，不得反过来用「PRD 没写」论证参考项目里存在的行为
    可以不做。

  技术栈与结构约束：后端导入根包是 `app`（不是 `borough`），源码在 backend/app/；PostgreSQL
  用默认 public schema，不建专用 schema；环境变量沿用无前缀命名，不加 BOROUGH_ 前缀；不同时
  引入 PostgreSQL 和 MySQL。

  接口契约唯一权威定义是 docs/backend-development-plan.md §8（ChatRequest / ChatResponse /
  ErrorResponse / SSE），实现后由 docs/api.md（OpenAPI 导出）确认；产品范围与验收标准唯一
  权威定义是 docs/PRD.md。涉及接口或数据库变更的提案，应先核对这两份文档，并在改动范围内
  同步更新它们。docs/api.md 与 backend/app/schemas/ 是实现结果的表达，不是需求来源：实现与
  约定不一致时整改实现，不得用生成文档倒推取消需求。

  文件索引与目录说明见 docs/project-navigation.md，当前阶段与未决风险见 docs/project-progress.md。

  执行边界（完整表述见 AGENTS.md §三）：在已授权的任务范围内持续完成实现、验证和本次修改导致
  的问题修复，本地 mock 操作无需逐步确认；只有缺少影响产品行为的必要决策、需要扩大实质范围，
  或将触及真实费用、生产变更、重要数据、Git 发布权限时才请求用户决定。某项操作受阻时继续完成
  不依赖它的工作。用户明确要求「只分析」「等审阅后修改」时严格停在该边界。

rules:
  proposal:
    - 涉及经营数据查询或商家可见字段的改动，须在设计里说明如何满足 R4（LLM 不碰 SQL）与
      R5（商家隔离）。
    - 涉及降级路径的改动，须列出对应的 degraded / degraded_reason / quality_status 等
      可见字段，不得把降级悄悄吞掉。
  tasks:
    - 任何调用真实 LLM 或产生费用的任务步骤，须先按 R3 标注预计调用次数、模型与费用，
      等待用户明确同意后才能执行；自动化测试步骤必须使用 mock LLM。

# 说明：以上 rules 只约束提案与任务文档这些产物的内容，不授予费用、Git 发布或生产操作权限；
# 那些权限只来自 AGENTS.md R2 / R3 下用户的明确同意。

operations:
  apply:
    guidance:
      - 完成实现与相应验证后汇报改动内容、验证结果和未完成项。未获 R2 的明确授权不执行
        git commit / push / tag / gh pr 等发布操作；等待提交审批不阻塞其他已授权的工作，
        也不要反复索要提交许可。
  archive:
    guidance:
      - 归档前把本次变更的结论同步进 docs/project-progress.md 的当前快照（只更新日期与内容，
        不追加逐日流水账）。
