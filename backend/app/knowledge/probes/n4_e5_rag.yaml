# E5 RAG 检索评测集（N4-C Task 1，PRD A7 / E5，契约 §6.14）
#
# 语料：app/knowledge/wiki_seed.json（21 篇团队知识，全部中文；每个业务域「名词解释」+「业务流程」各一篇，另有索引 README）。
# 每条 query 是商家对 `search_rules` 工具的提问；expected 按正文内容标注应命中的文档（source_path），
# 第一项为最主要的文档；expected 为空表示语料里没有答案，检索应承认找不到（matched=false）。
# kind：caliber 口径问答 / process 流程与规则 / field 字段与数据表 / colloquial 口语化改写 /
#       cross_language 英文问中文文档 / multi_doc 多文档组合 / no_answer 应当找不到。
#
# 双重用途（2026-10-02）：既是 E5 评测集（`app/eval/rag_e5.py`），也是索引版本切换的验证探针
# （`app/knowledge/index_versions.py`，§7.6：新版本 Recall@5 低于上一生效版本 95% 不切换）。
# 放在生产侧是因为 §5.6 只允许评测依赖生产、不允许反向。改动本文件会同时改变评测口径与切换闸门。

