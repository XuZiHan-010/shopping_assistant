# v1 两阶段意图识别的标注问题集（80 条）。评估器：`app/eval/intent_accuracy.py`。
#
# 被测对象是冻结基线里的 `IntentService`：第一阶段 `recognize`（回答模式 + 业务域），
# 第二阶段 `understand`（结构化查询意图，含白名单校验）。零 LLM 前置闸门不在本评测范围内。
#
# 标注口径：
# - `mode` / `category` 是列表，**第一项是首选标签**，其余是可接受标签。报告同时给出
#   「严格」（只认首选）与「宽松」（认整个列表）两个准确率。
# - 可接受标签只在问法本身有歧义、或分类提示词明文允许时才给，例如提示词写明
#   「工单、咨询 → DETAIL」，所以工单数量类问题同时接受 METRIC 与 DETAIL。
# - 范围外问题首选 INVALID、可接受 CHAT：两者都不会进入数据查询，区别只在回复话术。
# - `metric` 只标在首选且唯一可接受模式为 METRIC 的用例上；「成交额 / 销售额 / GMV」
#   同时接受 `gmv` 与 `gross_gmv`（两者定义相同，差别只在退款口径说明）。
# - `date` 以固定业务日 2026-10-08 为「今天」换算，只标无歧义的表述；「最近 N 天」
#   是否含当天有两种读法，两种都接受。「上周」「这几天」等不标日期。
# - 标签由评测作者一人标注，未经第二人复核；有争议的问法（如问助手自己是谁）未收入。

