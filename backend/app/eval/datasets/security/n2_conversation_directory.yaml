    - type: error_code
      expected: RESOURCE_FORBIDDEN
    - type: audit_written
      event_type: RESOURCE_SCOPE_VIOLATION
    - type: no_side_effect
      table: conversations
    - type: no_side_effect
      table: conversation_provenance

