# 跨租户类（CROSS）：商家/顾客角色互调端点、跨商家取他人资源。
# 覆盖 PRD §15 N1 / E3；四类 N1 安全集之一。

- id: SEC-CROSS-001
  introduced_in: N1
  role: MERCHANT
  skill: session
  risk: SECURITY
  locale: zh-CN
  form: ENDPOINT
  turns:
    - actor: merchant_a
      request:
        method: POST
        path: /api/v2/shop/sessions/demo-customer
        json: {}
  assertions:
    - type: http_status
      expected: 403
    - type: error_code
      expected: SESSION_ROLE_MISMATCH
    - type: audit_written
      event_type: SESSION_ROLE_MISMATCH
    - type: no_side_effect
      table: agent_sessions

