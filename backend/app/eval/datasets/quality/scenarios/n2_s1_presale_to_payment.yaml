  introduced_in: N2
  role: CUSTOMER
  skill: v2_shop_guide
  risk: QUALITY
  locale: en-US
  form: ENDPOINT
  rubric_id: answer_quality
  turns:
    - actor: customer_a
      primitive:
        name: session.bind_actor
        args:
          buyer_key: eval-s1-buyer-en
    - actor: customer_a
      request:
        method: POST
        path: /api/v2/shop/chat
        headers: {Accept: application/json, Accept-Language: en-US}
        json:
          client_request_id: eval-qlt-s1-002
          message: I need a warm scarf for winter. Compare a few from this shop and add the best one to my cart.
  assertions:
    - type: http_status
      expected: 200
    - type: response_field
      path: answer_mode
      expected: SHOP_GUIDE
    - type: response_field
      path: degraded
      expected: false
