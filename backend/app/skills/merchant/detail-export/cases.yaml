# N3 阶段 C Task 0：明细导出 Skill 的触发用例。

- id: detail-export-hit1
  introduced_in: N3
  role: MERCHANT
  skill: detail-export
  risk: QUALITY
  locale: zh-CN
  form: ENDPOINT
  rubric_id: skill_trigger
  turns:
    - actor: merchant_a
      request:
        method: POST
        path: /api/v2/merchant/chat
        headers: {Accept: application/json, Accept-Language: zh-CN}
        json: {message: 帮我导出最近 7 天的订单明细, client_request_id: skill-export-hit1}
  assertions:
    - type: http_status
      expected: 200
    - type: response_field
      path: tool_calls_include
      expected: load_skill:detail-export

