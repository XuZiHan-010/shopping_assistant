# N3 阶段 C Task 0：规则与指标口径问答 Skill 的触发用例。

- id: rules-metric-caliber-hit1
  introduced_in: N3
  role: MERCHANT
  skill: rules-metric-caliber
  risk: QUALITY
  locale: zh-CN
  form: ENDPOINT
  rubric_id: skill_trigger
  turns:
    - actor: merchant_a
      request:
        method: POST
        path: /api/v2/merchant/chat
        headers: {Accept: application/json, Accept-Language: zh-CN}
        json: {message: 净成交额是怎么算出来的, client_request_id: skill-rules-hit1}
  assertions:
    - type: http_status
      expected: 200
    - type: response_field
      path: tool_calls_include
      expected: load_skill:rules-metric-caliber

