# planning-goals：两条触发、一次误触发、一次边界反例；脚本化/模型评测需核对实际工具轨迹。
- id: planning-goals-hit1
  introduced_in: N3
  role: CUSTOMER
  skill: planning-goals
  risk: QUALITY
  locale: zh-CN
  form: ENDPOINT
  rubric_id: skill_trigger
  turns:
    - actor: customer
      request:
        method: POST
        path: /api/v2/shop/chat
        headers: {Accept: application/json, Accept-Language: zh-CN}
        json: {message: "我要布置一间书房，帮我规划要买哪些东西", client_request_id: skill-planning-goals-hit1}
  assertions:
    - type: http_status
      expected: 200
    - type: response_field
      path: tool_calls_include
      expected: load_skill:planning-goals

