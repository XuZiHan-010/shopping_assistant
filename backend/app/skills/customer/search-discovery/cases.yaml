# search-discovery：两条触发、一次误触发、一次边界反例；脚本化/模型评测需核对实际工具轨迹。
- id: search-discovery-hit1
  introduced_in: N3
  role: CUSTOMER
  skill: search-discovery
  risk: QUALITY
  locale: zh-CN
  form: ENDPOINT
  rubric_id: skill_trigger
  turns:
    - actor: customer
      request:
        method: POST
        path: /api/v2/shop/chat
        headers: {Accept: application/json, Accept-Language: zh-CN}
        json: {message: "预算 500 元，帮我找一件送朋友的礼物", client_request_id: skill-search-discovery-hit1}
  assertions:
    - type: http_status
      expected: 200
    - type: response_field
      path: tool_calls_include
      expected: load_skill:search-discovery

