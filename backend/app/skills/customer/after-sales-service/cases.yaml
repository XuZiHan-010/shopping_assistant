# after-sales-service：两条触发、一次误触发、一次边界反例；脚本化/模型评测需核对实际工具轨迹。
- id: after-sales-service-hit1
  introduced_in: N3
  role: CUSTOMER
  skill: after-sales-service
  risk: QUALITY
  locale: zh-CN
  form: ENDPOINT
  rubric_id: skill_trigger
  turns:
    - actor: customer
      request:
        method: POST
        path: /api/v2/shop/chat
        headers: {Accept: application/json, Accept-Language: zh-CN}
        json: {message: "我的订单能申请退货吗？", client_request_id: skill-after-sales-service-hit1}
  assertions:
    - type: http_status
      expected: 200
    - type: response_field
      path: tool_calls_include
      expected: load_skill:after-sales-service

