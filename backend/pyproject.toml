[project]
name = "borough-merchant-ai"
version = "0.1.0"
description = "Borough 商家 AI 助手后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    # Starlette 的传递依赖，但 SSE 路由直接用了 CancelScope(shield=True) 来保证
    # 客户端断开时的清理能跑完，所以显式声明。
    "anyio>=4.9,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langgraph>=0.2,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 PostgreSQL 的集成测试",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
exclude = "^(migrations|scripts|tests)/"

[tool.coverage.run]
branch = true
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
