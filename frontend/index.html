<!doctype html>
<!-- lang 和 <title> 只是首帧前的默认值（对应 zh-CN 默认语言）；挂载后由
     `useLocaleStore().restore()`（frontend/src/stores/locale.ts）按上次持久化
     的语言接管，两者必须保持一致，不要只改这里而不改 store 里的默认值。
     data-theme / data-size 同理：首帧前按「跟随系统 + 标准字号」渲染，挂载前由
     `usePreferencesStore().restore()`（frontend/src/stores/preferences.ts）接管。 -->
<html lang="zh-CN" data-theme="system" data-size="md">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Borough 商家 AI 助手：经营数据、分析与行动建议。" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)" />
    <title>Borough 商家 AI 助手</title>
    <!-- 挂载后由 App.vue 按当前语言把 href 切到 borough-logo.svg /
         borough-logo-en.svg，这里只给出首帧前的默认值（对应 zh-CN）。 -->
    <link rel="icon" type="image/svg+xml" href="/borough-logo.svg" />
    <!-- 网络字体只做增强：display=swap，且样式表以 media="print" 非阻塞加载、
         加载完再切到 all——拿不到字体（离线、被墙、首屏门禁的断网环境）时首屏
         不等待，直接用 tokens.css 里可读的系统回退字体。中文字体由 Google Fonts
         按 unicode-range 分片下发，只下载页面用到的字。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
