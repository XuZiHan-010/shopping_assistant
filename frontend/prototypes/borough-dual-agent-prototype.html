<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borough 双端 Agent 原型</title>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --well:#E9ECF2; --ink:#111827; --ink-2:#4A5263; --ink-3:#7B8394; --line:#D9DEE7;
  --m:#4F6EF7; --m-soft:#E6EBFE; --c:#128E80; --c-soft:#DDF3EF;
  --acc:var(--m); --acc-soft:var(--m-soft);
  --ok:#1F7A4D; --ok-soft:#DCF1E5; --warn:#9A620E; --warn-soft:#F8EBD2; --bad:#B03A24; --bad-soft:#F8E1DB;
  --code-bg:#111827; --code-ink:#D5DBE6; --code-dim:#7F8AA0; --code-key:#A9B8FF; --code-str:#8FDCC9;
  --shadow:0 1px 0 rgba(17,24,39,.04),0 8px 22px -12px rgba(17,24,39,.22);
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#151B24; --well:#1C2430; --ink:#E6EAF1; --ink-2:#A9B2C2; --ink-3:#7C8699; --line:#283141;
    --m:#93A6FF; --m-soft:#1F2A55; --c:#5ED1BE; --c-soft:#14332E;
    --ok:#6FD49C; --ok-soft:#153323; --warn:#E6B460; --warn-soft:#382A11; --bad:#F29580; --bad-soft:#3B1D16;
    --code-bg:#080B10; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#151B24; --well:#1C2430; --ink:#E6EAF1; --ink-2:#A9B2C2; --ink-3:#7C8699; --line:#283141;
  --m:#93A6FF; --m-soft:#1F2A55; --c:#5ED1BE; --c-soft:#14332E;
  --ok:#6FD49C; --ok-soft:#153323; --warn:#E6B460; --warn-soft:#382A11; --bad:#F29580; --bad-soft:#3B1D16;
  --code-bg:#080B10; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.65);
}
.shell[data-view="c"]{--acc:var(--c);--acc-soft:var(--c-soft)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.9em}
.shell{max-width:1400px;margin:0 auto;padding-inline:20px;padding-block:18px 48px}
@media (max-width:520px){.shell{padding-inline:16px}}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:44px;height:36px;flex:none}
.brand h1{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.assume{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--well);color:var(--ink-2);white-space:nowrap;font-weight:500}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--acc-soft);color:var(--acc)} .tag.m{background:var(--m-soft);color:var(--m)} .tag.c{background:var(--c-soft);color:var(--c)}
.tag.dash{background:transparent;border:1px dashed var(--warn);color:var(--warn)}

.views{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px;border-bottom:1px solid var(--line)}
.vtab{border:0;background:transparent;padding:9px 14px;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.vtab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--vc)}
.vtab[data-id="c"]{--vc:var(--c)} .vtab[data-id="m"]{--vc:var(--m)} .vtab[data-id="arch"]{--vc:var(--ink)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:16px;align-items:start}
@media (max-width:1080px){.stage{grid-template-columns:1fr}}
.app{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:13.5px;font-weight:600}
.panel-h .aside{font-size:12px;color:var(--ink-3)}
.panel-b{padding:12px 14px}
.hint{margin:0;font-size:12px;color:var(--ink-3)}
.empty{padding:14px;font-size:13px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* customer storefront */
.store-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.store-name{font-weight:700;font-size:18px;letter-spacing:.01em}
.store-name small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:12px 14px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--ink-3);background:linear-gradient(135deg,var(--well),var(--bg))}
.tile .tt{font-weight:500;font-size:13px;line-height:1.35}
.tile .pp{display:flex;justify-content:space-between;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.price{font-weight:600}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px;align-items:center;flex-wrap:wrap}
.line:first-child{border-top:0}
.timeline{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.timeline span{padding:1px 7px;border-radius:999px;background:var(--well);color:var(--ink-3)}
.timeline span.on{background:var(--ok-soft);color:var(--ok)}
.timeline span.now{background:var(--acc-soft);color:var(--acc);font-weight:600}

/* merchant */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--bad)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 11px var(--mono)}
.ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.bad{background:var(--bad-soft);color:var(--bad)} .ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.acc{background:var(--acc-soft);color:var(--acc)} .ic.c{background:var(--c-soft);color:var(--c)} .ic.mute{background:var(--well);color:var(--ink-3)}
.row .t{font-weight:500;line-height:1.4}
.row .s{font-size:12px;color:var(--ink-3)}
.ctl{display:grid;gap:12px}
.ctl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.ctl-row .k{grid-column:1/-1;font:11.5px var(--mono);color:var(--ink-3)}
.ctl-row output{font-weight:600;font-variant-numeric:tabular-nums}
.ctl-row input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.switch{display:flex;gap:8px;align-items:center;font-size:13px}
.switch input{accent-color:var(--acc)}
.boundary{display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
.boundary div{padding:6px 9px;border-radius:7px;background:var(--well)}

/* agent panel */
.agent{position:sticky;top:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);height:min(880px,calc(100vh - 24px));min-width:0}
@media (max-width:1080px){.agent{position:static;height:780px}}
.agent-h{padding:12px 14px 0;border-bottom:1px solid var(--line)}
.agent-h .who{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agent-h .rt{font:11.5px var(--mono);color:var(--ink-3)}
.atabs{display:flex;gap:2px;margin-top:8px}
.atabs button{border:0;background:transparent;padding:7px 10px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
.atabs .n{font:11px var(--mono);background:var(--well);border-radius:999px;padding:0 6px;margin-left:4px}
.pane{flex:1;overflow-y:auto;min-height:0}
.transcript{padding:14px;display:flex;flex-direction:column;gap:10px}
.transcript > *{flex:none}
.events{background:var(--code-bg);color:var(--code-ink);font:12px/1.55 var(--mono);padding:12px 14px}
.frame{padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);white-space:pre-wrap;word-break:break-word}
.frame .e{color:var(--code-key)} .frame .c{color:var(--code-dim)} .frame .s{color:var(--code-str)}
.inside{padding:12px 14px;display:grid;gap:14px}
.inside h4{margin:0 0 6px;font-size:12.5px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.toolgrid{display:flex;flex-wrap:wrap;gap:5px}
.tchip{font:11.5px var(--mono);padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink-3)}
.tchip.w{border-style:dashed}
.tchip.used{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.msg-user{align-self:flex-end;background:var(--acc);color:var(--bg);padding:8px 12px;border-radius:12px 12px 3px 12px;max-width:88%}
.msg-bot p{margin:0 0 6px}.msg-bot p:last-child{margin:0}
.msg-sys{font-size:12px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:8px}
.msg-link{font-size:12px;color:var(--ink-2);background:var(--warn-soft);border-radius:8px;padding:6px 9px}
.tool{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--well)}
.tool .st{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.tool.running .st{background:var(--acc);animation:pulse 1s infinite}
.tool.ok .st{background:var(--ok)} .tool.blocked .st{background:var(--bad)} .tool.error .st{background:var(--warn)}
.tool .nm{font:500 12px var(--mono);word-break:break-all}
.tool .args{font:11.5px var(--mono);color:var(--ink-3);word-break:break-word}
.tool .sum{color:var(--ink-2)}
.tool .gate{color:var(--bad);font-weight:600}
.intent{margin-top:4px;padding:6px 8px;border-radius:6px;background:var(--code-bg);color:var(--code-ink);font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tool.running .st{animation:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;border-top:1px solid var(--line)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.done{color:var(--ink-3)}
.composer{display:flex;gap:8px;padding:8px 14px 14px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--bg)}

/* cards */
.card{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:9px 12px 0;font-size:11.5px;color:var(--ink-3)}
.card h5{margin:4px 12px 2px;font-size:14px;font-weight:600}
.card .p{margin:2px 12px;font-size:13px;color:var(--ink-2)}
.card .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);margin-top:10px;background:var(--bg)}
.card .foot .msg{margin-right:auto;font-size:12px;color:var(--ink-2)}
.card .foot .msg.err{color:var(--bad)}
.diff{margin:8px 12px 0;border:1px solid var(--line);border-radius:8px;font-size:12.5px;overflow:hidden}
.diff-r{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:6px 9px;border-top:1px solid var(--line);align-items:baseline}
.diff-r:first-child{border-top:0}
.diff-r .b{text-decoration:line-through;color:var(--ink-3)}
.diff-r .a{font-weight:600}
.diff-r .f{grid-column:1/-1;font:11px var(--mono);color:var(--ink-3)}
.guard{margin:8px 12px 0;display:grid;gap:4px}
.guard div{font-size:12px;padding:5px 8px;border-radius:6px;background:var(--well);color:var(--ink-2)}
.guard div.v{background:var(--bad-soft);color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:10px 12px}
.strip .tile{padding:8px}
.bars{display:grid;gap:8px;padding:8px 12px}
.bar{display:grid;grid-template-columns:64px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar .track{height:8px;border-radius:4px;background:var(--well);position:relative}
.bar .fill{position:absolute;top:0;bottom:0;right:0;border-radius:4px;background:var(--bad)}
.digest li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;padding:8px 12px;border-top:1px solid var(--line)}
.digest li:first-child{border-top:0}
.digest .ic{grid-row:span 3;width:22px;height:22px}
.digest .fig{font-size:12px;color:var(--ink-2)}
.digest .nx{justify-self:start}

/* architecture */
.arch{display:grid;gap:16px}
.arch h2{margin:0;font-size:18px}
.arch > section > p{margin:4px 0 12px;color:var(--ink-2);max-width:80ch}
.diagram{overflow-x:auto}
.dg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:720px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.box b{display:block;font-size:13.5px}
.box span{display:block;font-size:12px;color:var(--ink-2)}
.box.c{border-color:var(--c);background:var(--c-soft)} .box.m{border-color:var(--m);background:var(--m-soft)}
.box.full{grid-column:1/-1}
.box.core{background:var(--well)}
.core-grid,.data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.data-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.core-grid div,.data-grid div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px}
.core-grid div b,.data-grid div b{font-size:12.5px}
.flow{grid-column:1/-1;text-align:center;font-size:12px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .mono{font-size:12px}
.qlist{display:grid;gap:8px;counter-reset:q}
.qlist div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.qlist div::before{counter-increment:q;content:"Q" counter(q);font:700 12px var(--mono);color:var(--ink-3);padding-top:2px}
.qlist b{display:block;font-size:13.5px}
.qlist span{font-size:12.5px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:10}
</style>
</head>
<body>
<div class="shell" id="shell" data-view="c">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 52" aria-hidden="true"><rect width="64" height="52" rx="13" fill="#111827"/><path d="M16 19h32l-3 20H19l-3-20Z" fill="#4f6ef7"/><path d="M23 19v-3.5a9 9 0 0 1 18 0V19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M25 29h14M25 34h10" stroke="#dce3ff" stroke-width="2" stroke-linecap="round"/><circle cx="46" cy="13" r="5" fill="#18a999"/></svg>
      <div><h1>Borough 双端 Agent 原型</h1><p>在 Anthropic commerce-agents 蓝图上融合：顾客购物 Agent + 商家运营 Agent，共用一个平台内核</p></div>
    </div>
    <div class="assume" aria-label="待定假设">
      <span>原型按以下假设搭建：</span>
      <span class="tag dash">模型 DeepSeek · function calling</span>
      <span class="tag dash">保留 R4：模板 SQL</span>
      <span class="tag dash">核心包按固定提交安装</span>
      <span class="tag dash">演示顾客身份</span>
    </div>
  </header>

  <nav class="views" role="tablist" aria-label="视图" id="views"></nav>
  <main id="main"></main>
</div>

<script>
(() => {
'use strict';
/* ============ utils ============ */
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const sleep = ms => new Promise(r => setTimeout(r, reduceMotion ? 30 : ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const cny = n => '¥' + Number(n).toLocaleString('zh-CN', {maximumFractionDigits:2});
const pct = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(d) + '%';
const $ = s => document.querySelector(s);
let seq = 0;
const nid = p => p + '-' + String(2430 + (++seq));
let toastTimer;
function toast(t){
  let el = $('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
}

/* ============ shared platform state (示意数据) ============ */
const P = {
  P1:{zh:'英式早餐茶礼盒', price:168, stock:42, sold30:96, cost:61, cat:'茶饮', attrs:{规格:'茶包 50 袋', 咖啡因:'含'}, shelf:'24 个月'},
  P2:{zh:'洋甘菊花草茶', price:88, stock:6, sold30:40, cost:29, cat:'茶饮', attrs:{规格:'30 袋', 咖啡因:'不含'}, shelf:'18 个月'},

/* ============ sessions & events ============ */
const UI = {view:'c', tab:{c:'chat', m:'chat'}, draft:{c:'', m:''}};
const SESS = {};
const sess = k => SESS[k] || (SESS[k] = {msgs:[], events:[], busy:false, ran:new Set(), used:new Set(), skills:new Set()});
function push(k, m){ sess(k).msgs.push(m); if (UI.view === k) renderPane(); return m; }
function ev(k, type, data){ sess(k).events.push({type, data}); if (UI.view === k){ const n = $('#ev-n'); if (n) n.textContent = sess(k).events.length; if (UI.tab[k] === 'events') renderPane(); } }

function ctx(k){
  const c = {
    user(t){ push(k, {t:'user', text:t}); },
    sys(h){ push(k, {t:'sys', html:h}); },
    link(h){ push(k, {t:'link', html:h}); },
    async say(h){ await sleep(300); push(k, {t:'bot', html:h}); const plain = h.replace(/<[^>]+>/g, ''); ev(k, 'text_delta', {text: plain.length > 70 ? plain.slice(0, 70) + '…' : plain}); },
    async tool(name, input, fn, opt = {}){
      const s = sess(k); s.used.add(name);
      if (name === 'load_skill') s.skills.add(input.name);
      const m = push(k, {t:'tool', name, input, status:'running', forced:!!opt.forced, intent:opt.intent});
      ev(k, 'tool_call', Object.assign({name, input}, opt.forced ? {grounding:'forced'} : {}));
      await sleep(opt.ms || 480);
      const r = (fn ? fn() : null) || {};
      Object.assign(m, {status:r.status || 'ok', summary:r.summary || '', gate:r.gate || null});
      ev(k, 'tool_result', Object.assign({name, status:m.status}, r.gate ? {gate:r.gate} : {}, r.summary ? {summary:r.summary} : {}));
      renderPane(); renderApp();
      return r;
    },
    async parallel(list){
      const ms = list.map(([name, input]) => { sess(k).used.add(name); ev(k, 'tool_call', {name, input}); return push(k, {t:'tool', name, input, status:'running'}); });
      await sleep(700);
      return list.map(([name, , fn], i) => { const r = (fn ? fn() : null) || {}; Object.assign(ms[i], {status:r.status || 'ok', summary:r.summary || ''}); ev(k, 'tool_result', {name, status:ms[i].status, summary:r.summary}); renderPane(); return r; });
    },
    ui(component, card){ push(k, {t:'card', component, card}); ev(k, 'ui', {component, payload:card.id ? {id:card.id} : {kind:card.kind}}); },
    ev(type, data){ ev(k, type, data); },
    route(t){ ev(k, '#', t); }
  };
  return c;
}
async function runScript(k, id){
  const s = sess(k);
  if (s.busy){ toast('上一轮还在回放，稍等'); return; }
  const sc = SCRIPTS[k].find(x => x.id === id);
  if (!sc) return;
  s.busy = true; s.ran.add(id); UI.tab[k] = 'chat'; renderAgent();
  const c = ctx(k);
  try { c.user(sc.text); await sc.run(c); c.ev('turn_complete', {stop_reason:'end_turn', usage:'原型回放，无真实调用'}); }
  finally { s.busy = false; renderAgent(); renderApp(); }
}

/* ============ changes (merchant staged writes / customer confirmations) ============ */
function makeChange(spec){
  const id = 'chg_' + (0x4b0 + (++seq) * 0x1d3).toString(16);
  S.changes[id] = Object.assign({id, status:'staged', error:null, result:null}, spec);
  return S.changes[id];
}
function guard(ch){
  const v = [];
  if (ch.kind === 'coupon'){ const depth = ch.off / ch.threshold * 100; if (depth > S.G.couponDepth) v.push(`券面折扣率 ${depth.toFixed(1)}% 超过上限 ${S.G.couponDepth}%`); }
  if (ch.kind === 'price' && Math.abs(ch.delta) > S.G.priceDelta) v.push(`调价 ${pct(ch.delta)} 超过上限 ${S.G.priceDelta}%`);
  return v;
}
async function approve(id){
  const ch = S.changes[id]; if (!ch || ch.status !== 'staged') return;
  const k = ch.side;
  if (k === 'm'){
    ev('m', '#', `商家工作台审批 → POST /api/merchant/changes/${id}/apply（仅本次调用有效的批准标记）`);
    const v = guard(ch);
    if (v.length){ ch.error = '应用时护栏复核未通过：' + v.join('；'); push('m', {t:'sys', html:esc(ch.error) + '，改动保持暂存。'}); renderAll(); return; }
  } else {
    ev('c', '#', `顾客在页面点击确认 → POST /api/shop/requests/${id}/confirm（聊天里说「确认」不算）`);
  }
  await sleep(300);
  APPLY[ch.kind](ch);
  ch.status = 'applied';
  ev(k, 'change_update', {change:{change_id:id, status:'applied'}});
  push(k, {t:'sys', html:`<code>${id}</code> 已生效。${esc(ch.result || '')}`});
  renderAll();
}
function discard(id){
  const ch = S.changes[id]; if (!ch || ch.status !== 'staged') return;
  ch.status = 'discarded'; ev(ch.side, 'change_update', {change:{change_id:id, status:'discarded'}});
  push(ch.side, {t:'sys', html:`<code>${id}</code> 已丢弃，没有任何改动。`}); renderAll();
}
const APPLY = {
  listing(ch){
    P[ch.product].shelf = ch.after;
    const sig = S.signals.find(s => s.kind === 'info_gap' && s.product === ch.product && !s.handled);
    if (sig){ sig.handled = true; ch.result = `商品页已更新，信号 ${sig.id} 已关闭。顾客 Agent 下次被问到会直接回答。`; }
    else ch.result = '商品页已更新。';
    ev('c', '#', `商品目录更新：${P[ch.product].zh} 的保质期字段已由商家补全（来自商家侧变更 ${ch.id}）`);
  },
  coupon(ch){
    S.coupons.push({code:ch.code, product:ch.product, threshold:ch.threshold, off:ch.off, ends:ch.ends});
    ch.result = `券 ${ch.code} 已上线，顾客端商品卡片和顾客 Agent 都能看到。`;
    ev('c', '#', `优惠券上线：${ch.code}（${P[ch.product].zh} 满 ${ch.threshold} 减 ${ch.off}）`);
  },
  ticket_reply(ch){
    const r = S.returns.find(x => x.id === ch.returnId);
    if (r){ r.status = '商家已同意 · 退货退款，运费由商家承担'; r.reply = ch.reply; }
    const sig = S.signals.find(s => s.kind === 'return' && s.ref === ch.returnId); if (sig) sig.handled = true;
    ch.result = '回复已发给顾客，退货单状态已更新。';
    ev('c', '#', `退货单 ${ch.returnId} 状态更新：商家已同意（来自商家侧变更 ${ch.id}）`);
  },
  return_request(ch){
    const rid = nid('R');
    S.returns.push({id:rid, order:ch.order, product:ch.product, reason:ch.reason, status:'待商家处理'});
    const tid = nid('T'); S.tickets.push({id:tid, returnId:rid});
    ch.result = `退货申请 ${rid} 已提交，客服工单 ${tid} 已建立。`;
    emitSignal({kind:'return', kindZh:'退货申请', ref:rid, product:ch.product, order:ch.order, text:`订单 ${ch.order} 的${P[ch.product].zh}申请退货：运输破损`});
  }
};

function buildDigest(){
  const e = [];
  S.signals.filter(s => !s.handled).forEach(s => e.push({tone:'c', mk:'顾', title:s.text, fig:`来自顾客 Agent · ${s.id}`, next: s.kind === 'info_gap' ? '补充商品信息' : '回复顾客', run: s.kind === 'info_gap' ? 'm5' : 'm7'}));
  e.push({tone:'bad', mk:'0', title:'酸种面包预拌粉已售罄 5 天', fig:'近 30 天卖出 15 件；GMV 下降的主要来源', next:'看 GMV 分析', run:'m2'});
  e.push({tone:'warn', mk:'!', title:'洋甘菊花草茶只剩 6 件', fig:'近 30 天卖出 40 件（约 1.3 件/天），约 4.5 天后售罄', next:null});
  Object.values(S.changes).filter(x => x.side === 'm' && x.status === 'staged').forEach(x => e.push({tone:'acc', mk:'…', title:'待批准：' + x.headline, fig:x.id, next:null}));
  e.push({tone:'mute', mk:'S', title:'帆布购物袋滞销：库存 120，近 30 天卖出 3 件', fig:'按成本占用约 ¥1,680', next:null});
  return e.slice(0, 6);
}

}
function renderAll(){ renderViews(); renderMain(); }
function renderMain(){
  if (UI.view === 'arch'){ $('#main').innerHTML = renderArch(); return; }
  $('#main').innerHTML = `<div class="stage"><section class="app" id="app" aria-live="polite"></section><aside class="agent" id="agent" aria-label="Agent 面板"></aside></div>`;

}
function renderApp(){
  const el = $('#app'); if (!el) return;

  el.innerHTML = UI.view === 'c' ? renderCustomer() : renderMerchant();
  if (focusId){ const f = document.getElementById(focusId); if (f) f.focus(); }
}

function matchScript(k, text){
  const t = text.trim();
  const exact = SCRIPTS[k].find(x => x.text === t); if (exact) return exact;
  const rules = {
    c: [[/茶礼|长辈|推荐/, 'c1'], [/保质期|果酱/, 'c2'], [/优惠券|加入购物车|加购/, 'c3'], [/结账/, 'c4'], [/到哪|物流/, 'c5'], [/退货|裂/, 'c6'], [/记住|手机/, 'c7'], [/评价/, 'c9']],
    m: [[/处理|今天/, 'm1'], [/GMV|下降/i, 'm2'], [/导出|明细/, 'm3'], [/运费|规则/, 'm4'], [/保质期|补上/, 'm5'], [/券|满 ?200/, 'm6'], [/回复|裂/, 'm7'], [/批准/, 'm8']]
  }[k];
  const hit = rules.find(([re]) => re.test(t));
  return hit ? SCRIPTS[k].find(x => x.id === hit[1]) : null;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, k = UI.view;
  if (act === 'view'){ UI.view = id; if (id === 'm') S.unseenSignals = 0; renderAll(); }
  else if (act === 'atab'){ UI.tab[k] = id; renderAgent(); }
  else if (act === 'run'){
    const target = SCRIPTS.m.find(x => x.id === id) && k !== 'm' ? 'm' : k;
    runScript(target, id);
  }
  else if (act === 'approve') approve(id);
  else if (act === 'discard') discard(id);
  else if (act === 'c-add'){
    const l = S.cart.find(x => x.id === id && x.by === '页面'); if (l) l.qty += 1; else S.cart.push({id, qty:1, by:'页面'});
    ev('c', '#', `页面按钮加入购物车 ${id}（宿主操作，不经过模型）`); ev('c', 'cart_update', {cart:{lines:S.cart.map(x => ({product_id:x.id, quantity:x.qty}))}}); renderApp();
  }
  else if (act === 'c-forget'){ const f = S.memory.c.splice(Number(id), 1)[0]; ev('c', '#', `顾客删除记忆：${f.key}`); renderAll(); }
  else if (act === 'pay'){
    if (!S.cart.length) return;
    const oid = nid('O');
    S.orders.push({id:oid, items:S.cart.map(l => [l.id, l.qty]), total:cartTotal(), status:'已下单', stage:0});
    S.cart = [];
    ev('c', '#', `Borough 结账页完成支付（原型模拟）→ 新订单 ${oid}；支付信息从未进入模型`);
    toast(`原型模拟：已在结账页完成支付，生成订单 ${oid}。`); renderAll();
  }
  else if (act === 'download'){ toast('原型里不生成文件。真实实现沿用现有 /api/exports/{id} 签名下载。'); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'composer') return;
  e.preventDefault();
  const k = UI.view, input = $('#composer-input'), text = input.value.trim(); if (!text) return;
  UI.draft[k] = '';
  const sc = matchScript(k, text);
  if (sc){ runScript(k, sc.id); return; }
  push(k, {t:'user', text}); push(k, {t:'sys', html:'原型只回放预设流程，没有接模型。试试下面的预设提问。'}); renderAgent();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'composer-input'){ UI.draft[UI.view] = t.value; return; }
  if (t.dataset.bind === 'coupon'){ S.G.couponDepth = Number(t.value); $('#o-coupon').textContent = t.value + '%'; }
  if (t.dataset.bind === 'price'){ S.G.priceDelta = Number(t.value); $('#o-price').textContent = t.value + '%'; }
});
document.addEventListener('change', e => { if (e.target.dataset.bind === 'host') S.G.host = e.target.checked; });

renderAll();
})();
</script>
</body>
