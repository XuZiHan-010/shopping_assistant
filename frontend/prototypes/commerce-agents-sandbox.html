<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commerce Agents 沙盘</title>
<style>
:root{
  --bg:#EFF1ED; --surface:#FFFFFF; --well:#E6E9E3; --ink:#151A18; --ink-2:#4B5550; --ink-3:#78817C; --line:#D6DAD3;
  --a:#4A3DB5; --a-soft:#E8E5FA; --s:#2C6A38; --s-soft:#E0EEDC;
  --acc:var(--a); --acc-soft:var(--a-soft);
  --ok:#22704A; --ok-soft:#DCEFE3; --warn:#94600F; --warn-soft:#F6EAD1; --bad:#AE311E; --bad-soft:#F7DFD9;
  --code-bg:#1A1F1D; --code-ink:#D3DCD7; --code-dim:#7F8B85; --code-key:#B8AEF7; --code-str:#9ED2A4;
  --shadow:0 1px 0 rgba(20,26,24,.04),0 6px 18px -10px rgba(20,26,24,.18);
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --display:"Bricolage Grotesque","Noto Sans SC","PingFang SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1110; --surface:#161A19; --well:#1E2321; --ink:#E5EAE7; --ink-2:#A7B0AB; --ink-3:#7A847F; --line:#2A302D;
    --a:#ABA1F6; --a-soft:#26224A; --s:#8BC994; --s-soft:#1C3121;
    --ok:#72CF99; --ok-soft:#163223; --warn:#E2B25F; --warn-soft:#382A12; --bad:#F2917D; --bad-soft:#3B1D17;
    --code-bg:#0A0C0B; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1110; --surface:#161A19; --well:#1E2321; --ink:#E5EAE7; --ink-2:#A7B0AB; --ink-3:#7A847F; --line:#2A302D;
  --a:#ABA1F6; --a-soft:#26224A; --s:#8BC994; --s-soft:#1C3121;
  --ok:#72CF99; --ok-soft:#163223; --warn:#E2B25F; --warn-soft:#382A12; --bad:#F2917D; --bad-soft:#3B1D17;
  --code-bg:#0A0C0B; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
}
.shell[data-project="shopify"]{--acc:var(--s);--acc-soft:var(--s-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.92em}
.shell{max-width:1380px;margin:0 auto;padding-inline:20px;padding-block:22px 48px}
@media (max-width:520px){.shell{padding-inline:16px}}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.08;margin:4px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--ink-2);max-width:68ch}
.sim-note{display:flex;gap:10px;align-items:flex-start;max-width:420px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sim-note b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;margin-top:6px}

/* project switch */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 12px}
@media (max-width:760px){.projects{grid-template-columns:1fr}}
.proj{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,box-shadow .15s}
.proj:hover{border-color:var(--ink-3)}
.proj[aria-selected="true"]{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.proj .mark{grid-row:span 2;width:34px;height:34px;border-radius:9px;background:var(--pcs);color:var(--pc);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.proj .nm{font-weight:600;font-size:15px}
.proj .meta{font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px}
.proj[data-id="anthropic"]{--pc:var(--a);--pcs:var(--a-soft)}
.proj[data-id="shopify"]{--pc:var(--s);--pcs:var(--s-soft)}
.proj-desc{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);margin-top:4px}

.surfaces{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.surf{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-2)}
.surf small{color:var(--ink-3);margin-left:6px;font-family:var(--mono);font-size:11px}
.surf[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.surf[aria-selected="true"] small{color:inherit;opacity:.7}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:16px;align-items:start}
@media (max-width:1080px){.stage{grid-template-columns:1fr}}
.app{min-width:0;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:13.5px;font-weight:600}
.panel-h .aside{font-size:12px;color:var(--ink-3)}
.panel-b{padding:12px 14px}
.hello{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.hello h2{font-family:var(--display);font-size:22px;margin:0;font-weight:600}
.hello p{margin:2px 0 0;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--well);color:var(--ink-2);white-space:nowrap;font-weight:500}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.acc{background:var(--acc-soft);color:var(--acc)}
.tag.mono{font-family:var(--mono);font-size:11px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
@media (max-width:640px){.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--bad)}
.spark{display:block;width:100%;height:46px;margin-top:4px}

.seg{display:inline-flex;background:var(--well);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:6px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono)}
.ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.bad{background:var(--bad-soft);color:var(--bad)} .ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.acc{background:var(--acc-soft);color:var(--acc)} .ic.mute{background:var(--well);color:var(--ink-3)}
.row .t{font-weight:500;line-height:1.35}
.row .m{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .m b{color:var(--ink-2);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.shell[data-project] .btn.primary{color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{padding:14px;color:var(--ink-3);font-size:13px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

.ctl{display:grid;gap:12px}
.ctl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.ctl-row label{font-size:13px}
.ctl-row .k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);grid-column:1/-1}
.ctl-row output{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
.ctl-row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px}
.switch input{accent-color:var(--acc);width:16px;height:16px}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.hint{font-size:12px;color:var(--ink-3);margin:0}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th{font-size:11.5px;font-weight:500;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.archived td{color:var(--ink-3)}
td .sub{display:block;font-size:11.5px;color:var(--ink-3);max-width:34ch}
td input[type=number]{width:62px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--surface)}

.store-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px 14px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.tile .ph{aspect-ratio:4/3;max-width:100%;border-radius:7px;background:repeating-linear-gradient(135deg,var(--well) 0 8px,transparent 8px 16px),var(--bg);display:grid;place-items:center;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.tile .tt{font-weight:500;font-size:13px;line-height:1.3}
.tile .pp{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-size:13px}
.cart-line{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:13px}
.cart-line:first-child{border-top:0}

.ledger{font-family:var(--mono);font-size:12px;background:var(--code-bg);color:var(--code-ink);border-radius:0 0 12px 12px;padding:10px 14px;max-height:260px;overflow:auto}
.ledger .ln{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08);white-space:pre-wrap;word-break:break-word}
.ledger .ln:last-child{border-bottom:0}
.ledger .dim{color:var(--code-dim)}
.ledger .rej{color:#F2917D}
.ledger .okc{color:#8FD9AE}
.big-count{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

.note-box{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.note-box .en{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);display:block;margin-top:4px}

/* agent */
.agent{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);height:min(860px,calc(100vh - 32px));min-width:0}
@media (max-width:1080px){.agent{position:static;height:760px}}
.agent-h{padding:12px 14px 0;border-bottom:1px solid var(--line)}
.agent-h .who{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agent-h .who b{font-size:14px}
.agent-h .rt{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.atabs{display:flex;gap:2px;margin-top:8px}
.atabs button{border:0;background:transparent;padding:7px 10px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.atabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:500}
.atabs .n{font-family:var(--mono);font-size:11px;background:var(--well);border-radius:999px;padding:0 6px;margin-left:4px}
.transcript{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.events{flex:1;overflow:auto;background:var(--code-bg);color:var(--code-ink);font:12px/1.55 var(--mono);padding:12px 14px;min-height:0}
.frame{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.07);white-space:pre-wrap;word-break:break-word}
.frame .e{color:var(--code-key)} .frame .c{color:var(--code-dim)} .frame .s{color:var(--code-str)}
.transcript > *{flex:none}
.msg-user{align-self:flex-end;background:var(--acc);color:var(--bg);padding:8px 12px;border-radius:12px 12px 3px 12px;max-width:88%}
.msg-bot{max-width:100%;line-height:1.6}
.msg-bot p{margin:0 0 6px}
.msg-bot p:last-child{margin-bottom:0}
.msg-sys{font-size:12px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:8px}
.tool{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--well)}
.tool .st{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.tool.running .st{background:var(--acc);animation:pulse 1s infinite}
.tool.ok .st{background:var(--ok)} .tool.blocked .st{background:var(--bad)} .tool.error .st{background:var(--warn)}
.tool .nm{font-family:var(--mono);font-weight:500;word-break:break-all}
.tool .args{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);word-break:break-word}
.tool .sum{color:var(--ink-2)}
.tool .gate{color:var(--bad);font-weight:600}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tool.running .st{animation:none}}
.typing{font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;border-top:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.done{color:var(--ink-3)}
.composer{display:flex;gap:8px;padding:8px 14px 14px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--bg)}

/* generative cards */
.card{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:9px 12px 0;font-size:11.5px;color:var(--ink-3)}
.card h4{margin:4px 12px 2px;font-size:14px;font-weight:600;line-height:1.35}
.card .p{margin:2px 12px;font-size:13px;color:var(--ink-2)}
.card .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);margin-top:10px;background:var(--bg)}
.card .foot .msg{margin-right:auto;font-size:12px;color:var(--ink-2)}
.card .foot .msg.err{color:var(--bad)}
.diff{margin:8px 12px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
.diff-r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:6px 9px;border-top:1px solid var(--line);align-items:baseline;font-variant-numeric:tabular-nums}
.diff-r:first-child{border-top:0}
.diff-r .f{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.diff-r .b{text-decoration:line-through;color:var(--ink-3)}
.diff-r .a{font-weight:600}
.longdiff{margin:8px 12px 0;display:grid;gap:6px;font-size:12.5px}
.longdiff div{border-radius:7px;padding:7px 9px}
.longdiff .b{background:var(--bad-soft)} .longdiff .a{background:var(--ok-soft)}
.longdiff .gap{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 4px;font-weight:500}
.mathline{margin:8px 12px 0;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.guard{margin:8px 12px 0;display:grid;gap:4px}
.guard div{font-size:12px;padding:5px 8px;border-radius:6px;background:var(--well);color:var(--ink-2)}
.guard div.v{background:var(--bad-soft);color:var(--bad)}
.digest li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:8px 12px;border-top:1px solid var(--line)}
.digest li:first-child{border-top:0}
.digest .ic{grid-row:span 3;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--mono)}
.digest .fig{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.digest .nx{justify-self:start}
.cmp{width:100%;min-width:0;font-size:12.5px}
.cmp th,.cmp td{padding:6px 10px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:10px 12px 0}
.strip .tile{padding:8px}
.bars{display:grid;gap:8px;padding:8px 12px 0}
.bar{display:grid;grid-template-columns:88px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar .track{height:8px;border-radius:4px;background:var(--well);position:relative}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:4px}
.sql{margin:6px 0 0;padding:7px 9px;background:var(--code-bg);color:var(--code-ink);border-radius:6px;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}

.patterns{margin-top:22px}
.patterns h2{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:600}
.patterns > p{margin:0 0 12px;color:var(--ink-2);max-width:72ch}
.pat{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pat b{display:block;font-size:13.5px;margin-bottom:2px}
.pat span{display:block;font-size:12.5px;color:var(--ink-2)}
.pat code{display:block;margin-top:6px;font-size:11px;color:var(--ink-3);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:10}
</style>
</head>
<body>

<div class="shell" id="shell" data-project="anthropic">
  <header class="top">
    <div>
      <div class="eyebrow">Borough 外部参考 · 交互沙盘</div>
      <h1>Commerce Agents 沙盘</h1>
      <p class="lead">把 Anthropic 与 Shopify 两个电商 Agent 参考项目的核心流程搬进同一页：左边是它们的门户 / 店铺界面，右边是 Agent 对话和模拟 SSE 事件。点提问、点审批、拨动护栏，看同一个请求在不同配置下怎么被放行或拦下。</p>
    </div>

/* ---------------- script context ---------------- */
function ctx(k){
  const c = {
    user(text){ push(k, {t:'user', text}); },
    sys(html){ push(k, {t:'sys', html}); },
    async say(html){
      await sleep(320);
      push(k, {t:'bot', html});
      const plain = html.replace(/<[^>]+>/g, '');
      ev(k, 'text_delta', {text: plain.length > 72 ? plain.slice(0, 72) + '…' : plain});
    },
    async tool(name, input, fn, opt = {}){
      const m = push(k, {t:'tool', name, input, status:'running', forced:!!opt.forced});
      ev(k, 'tool_call', Object.assign({name, input}, opt.forced ? {grounding:'forced'} : {}));
      await sleep(opt.ms || 520);
      const r = (fn ? fn() : null) || {};
      m.status = r.status || 'ok'; m.summary = r.summary || ''; m.gate = r.gate || null;
      const out = {name, status: m.status === 'ok' ? 'ok' : m.status};
      if (r.gate) out.gate = r.gate;
      if (r.summary) out.summary = r.summary;
      ev(k, 'tool_result', out);
      renderTranscript(); renderApp();
      return r;
    },
    async parallel(list){
      const ms = list.map(([name, input]) => {
        ev(k, 'tool_call', {name, input});
        return push(k, {t:'tool', name, input, status:'running'});
      });
      await sleep(760);
      return list.map(([name, , fn], i) => {
        const r = (fn ? fn() : null) || {};
        Object.assign(ms[i], {status:r.status || 'ok', summary:r.summary || '', gate:r.gate || null});
        ev(k, 'tool_result', Object.assign({name, status:ms[i].status}, r.summary ? {summary:r.summary} : {}));
        renderTranscript();
        return r;
      });
    },
    ui(component, card){
      push(k, {t:'card', component, card});
      ev(k, 'ui', {component:component.replace(/^present_/, ''), payload: card.kind === 'change' ? {change_id: card.id} : {kind: card.kind}});
    },
    ev(type, data){ ev(k, type, data); },
    route(text){ route(k, text); }
  };
  return c;
}

async function runScript(k, id, userText){
  const s = sess(k);
  if (s.busy) { toast('上一轮还在回放，稍等一下'); return; }
  const sc = SCRIPTS[k].find(x => x.id === id);
  if (!sc) return;
  s.busy = true; s.ran.add(id);
  UI.tab[k] = UI.tab[k] || 'chat';
  renderAgent();
  const c = ctx(k);
  try {
    c.user(userText || sc.text);
    await sc.run(c);
    c.ev('turn_complete', {stop_reason:'end_turn', usage:'沙盘回放，无真实 token 用量'});
  } catch (error) {
    c.ev('error', {message:'本次模拟未完成，请重置后重试。'});
    c.sys('模拟脚本出现错误：' + esc(error.message));
  } finally {
    s.busy = false;
    renderAgent(); renderApp();
  }
}

async function hostApply(id){
  const ch = CH[id];
  if (!ch || ch.status !== 'staged' || ch.busy) return;
  const k = ch.k;
  ch.busy = true; ch.error = null; renderTranscript(); renderApp();
  route(k, `宿主审批界面 → POST /api/merchant/changes/${id}/apply（标记已批准，仅对本次调用有效）`);
  await sleep(420);
  const G = k === 'am' ? AM.G : SM.G;
  const v = guardrails(ch, G);
  if (v.length){
    ch.busy = false;
    ch.error = '应用时按当前配置复核护栏未通过：' + v.join('；');
    ev(k, 'change_update', {change:{change_id:id, status:'staged', held_by:'guardrail'}});
    push(k, {t:'sys', html:`应用被护栏拦下：${esc(v.join('；'))}。变更保持暂存。`});
    renderApp(); return;
  }
  if (k === 'am') applyAm(ch); else await applySm(ch);
  ch.busy = false;
  ev(k, 'change_update', {change:{change_id:id, status:ch.status}});
  if (ch.status === 'applied') push(k, {t:'sys', html:`宿主审批：<code>${id}</code> 已应用。${ch.result ? esc(ch.result) : ''}`});
  renderApp(); renderTranscript();
}
function hostDiscard(id){
  const ch = CH[id];
  if (!ch || ch.status !== 'staged') return;
  route(ch.k, `宿主审批界面 → POST /api/merchant/changes/${id}/discard`);
  ch.status = 'discarded'; ch.error = null;
  ev(ch.k, 'change_update', {change:{change_id:id, status:'discarded'}});
  push(ch.k, {t:'sys', html:`<code>${id}</code> 已丢弃，线上没有任何改动。`});
  renderApp(); renderTranscript();
}
function applyAm(ch){
  if (ch.kind === 'inventory_action'){
    const it = AM.inv[ch.target];
    it.stock = ch.items[0].after;
    ch.result = `库存 ${ch.items[0].before} → ${it.stock}。`;
  } else if (ch.kind === 'listing_update'){
    AM.inv[ch.target].missingNote = true;
    ch.result = '描述已更新；墙面覆盖面积与材质仍待商家提供。';
  } else if (ch.kind === 'promotion'){
    ch.result = `促销已交给宿主系统排期（${ch.depth}% · 至 ${ch.ends}）。`;
  }
  ch.status = 'applied';
}
async function applySm(ch){
  const p = smP(ch.target);
  const k = 'sm';
  if (ch.kind === 'inventory_action'){
    const v = p.variants[0];
    const delta = ch.items[0].after - ch.items[0].before;
    if (SM.stockMove === 'sold' && !ch.movedOnce){ v.qty -= 1; ch.movedOnce = true; }
    SM.mutations.push({op:'InventoryLevel', kind:'query', vars:`{inventoryItemId, locationId} → available=${v.qty}`});
    route(k, `现读 InventoryLevel：available=${v.qty}（不用目录缓存里的旧数）`);
    await sleep(300);
    if (SM.stockMove === 'race' && !ch.raced){
      ch.raced = true;
      const readQty = v.qty; v.qty -= 1;
      SM.mutations.push({op:'AdjustInventory', kind:'rejected', vars:`delta:+${delta}, changeFromQuantity:${readQty}, idempotencyKey:… → 店铺拒绝（此刻 available=${v.qty}）`});
      route(k, 'mutation AdjustInventory 被拒：读取与写入之间库存又变了');
      ch.error = `店铺拒绝：changeFromQuantity=${readQty}，但写入时库存已变为 ${v.qty}。变更保持暂存，可再次应用。`;
      SM.stockMove = 'none';
      return;
    }
    const from = v.qty;
    SM.mutations.push({op:'AdjustInventory', kind:'ok', vars:`delta:+${delta}, changeFromQuantity:${from}, reason:"correction", idempotencyKey:…`});
    v.qty = from + delta;
    ch.result = `delta +${delta} 应用于现读库存 ${from} → ${v.qty}。`;
    if (from !== ch.items[0].before) ch.result += `（暂存时是 ${ch.items[0].before}，应用的是增量，不是目标值）`;
    SM.stockMove = 'none';
  } else if (ch.kind === 'price_update'){
    const ratio = ch.items[0].after / ch.items[0].before;
    const vars = p.variants.map(v => { v.price = Math.round(v.price * ratio * 100) / 100; return `${v.t}:${v.price.toFixed(2)}`; });
    SM.mutations.push({op:'SetVariantPrices', kind:'ok', vars:`productVariantsBulkUpdate [${vars.join(', ')}]`});
    ch.result = p.variants.length > 1 ? `${p.variants.length} 个变体各按同一比例 ${pct((ratio - 1) * 100)} 移动，阶梯间距不变。` : '';
  } else if (ch.kind === 'listing_update'){
    p.desc = ch.items[0].after; p.seo = ch.items[1] ? ch.items[1].after : p.seo;
    SM.mutations.push({op:'UpdateProduct', kind:'ok', vars:'product: {descriptionHtml, seo{description}}（2026-07 的 product: 形状）'});
    ch.result = '描述与 SEO 描述已写回。';
  }
  ch.status = 'applied';
  route(k, `Admin mutation 已发送，账本累计 ${SM.mutations.filter(m => m.kind !== 'query').length} 次写调用`);
}

function spark(values, w = 280, h = 46){
  const min = Math.min(...values), max = Math.max(...values), pad = 4;
  const x = i => pad + i * (w - pad * 2) / (values.length - 1);
  const y = v => h - pad - (v - min) / (max - min || 1) * (h - pad * 2);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = values.length - 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="14 天销售额走势">
    <polygon points="${x(0)},${h} ${pts} ${x(last)},${h}" fill="var(--acc-soft)"></polygon>
    <line x1="${x(7)}" x2="${x(7)}" y1="0" y2="${h}" stroke="var(--line)" stroke-dasharray="3 3"></line>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>
    <circle cx="${x(last)}" cy="${y(values[last])}" r="3" fill="var(--acc)"></circle></svg>`;
}

  let rows = [];
  const issueRows = AM.issues.map(i => ({type:'issue', i}));
  const low = alerts.filter(a => a.kind === 'low').sort((a, b) => (amCover(a.it) ?? 0) - (amCover(b.it) ?? 0)).map(a => ({type:'inv', a}));
  const slow = alerts.filter(a => a.kind === 'slow').map(a => ({type:'inv', a}));
  if (AM.filter === 'orders') rows = issueRows;
  else if (AM.filter === 'stock') rows = low;
  else if (AM.filter === 'slow') rows = slow;
  else rows = [...low.slice(0, 1), ...issueRows, ...low.slice(1), ...slow];
  const staged = changesOf('am').filter(c => c.status === 'staged');
  const rowHTML = r => {
    if (r.type === 'issue'){
      const i = r.i, map = {return_spike:['bad','R','退货激增'], buyer_message:['acc','M','买家留言'], delayed:['warn','D','物流延误']}[i.kind];
      return `<li class="row"><span class="ic ${map[0]}">${map[1]}</span><div><div class="t">${esc(i.zh)}</div><div class="m">${map[2]} · 订单 <span class="mono">${i.order}</span></div></div><button class="btn ghost" data-act="ask" data-text="${esc(i.kind === 'return_spike' ? '旅行枕退货太多了，干脆打 4 折清一批库存。' : `订单 ${i.order} 我有哪些处理办法？${i.zh}。`)}">${i.kind === 'buyer_message' ? '起草回复' : '问助手'}</button></li>`;
    }
    const {id, it, kind} = r.a;
    const sold = kind === 'low' && it.stock === 0;
    const cov = amCover(it);
    const meta = [sold ? '<b class="down">已售罄</b>' : `<b>${it.stock} 件在库</b>`, kind === 'low' && !sold && cov != null ? `约 ${cov.toFixed(1)} 天` : '', `30 天卖出 ${it.sold30}`, `<span class="mono">${id}</span>`, it.paused ? '已暂停' : ''].filter(Boolean).join(' · ');
    return `<li class="row"><span class="ic ${sold ? 'bad' : toneMark[kind]}">${kind === 'slow' ? 'S' : sold ? '0' : '!'}</span><div><div class="t">${esc(it.zh)} <span style="color:var(--ink-3);font-weight:400">${esc(it.en)}</span></div><div class="m">${meta}</div></div><button class="btn ghost" data-act="ask" data-text="${esc(id === 'AR-2102' ? '给海洋墙贴补够一个月的货，顺便把描述里缺的补上。上线前先给我看。' : kind === 'low' ? `为 ${it.zh}（${id}）起草补货计划。` : `为 ${it.zh}（${id}）规划降价清仓。`)}">${kind === 'low' ? '起草补货' : '规划清仓'}</button></li>`;
  };
  const G = AM.G;
  return `
  <div class="panel"><div class="panel-b hello">
    <div><h2>早上好</h2><p>${esc(`本周销售额${chg(WK.s1, WK.s2) >= 0 ? '上升' : '下降'} ${Math.abs(chg(WK.s1, WK.s2)).toFixed(1)}%，${AM.issues.length} 笔订单和 ${alerts.filter(a => a.kind === 'low').length} 个商品今天需要你。`)}</p></div>
    <span class="tag mono">fixture 日期 03-30 → 04-12，加载时整周平移</span>
  </div>
  <div class="kpis" style="border-top:1px solid var(--line)">
    ${kpi('销售额（7 天）', usd(WK.s2).replace(/\.\d+$/, ''), chg(WK.s1, WK.s2), spark(DAILY.map(r => r[1])))}
    ${kpi('订单', num(WK.o2), chg(WK.o1, WK.o2))}
    ${kpi('访客', num(WK.t2), chg(WK.t1, WK.t2))}
    ${kpi('转化率', conv2.toFixed(2) + '%', chg(conv1, conv2))}
  </div></div>

  ${staged.length ? `<div class="panel" style="border-color:var(--acc)"><div class="panel-h"><h3>${staged.length} 项改动等你批准</h3><span class="aside">预览卡片本身不批准任何东西；只有这里和卡片上的按钮走宿主审批路由</span></div>${changeRowsHTML('am')}</div>` : ''}

  <div class="panel">
    <div class="panel-h"><h3>需要处理</h3>
      <div class="seg" role="group" aria-label="筛选">${[['all','全部'],['orders','订单'],['stock','库存'],['slow','滞销']].map(([id, l]) => `<button data-act="filter" data-id="${id}" aria-pressed="${AM.filter === id}">${l}</button>`).join('')}</div>
    </div>
    <ul class="rows">${rows.map(rowHTML).join('') || '<li class="empty">这一类没有待处理项。</li>'}</ul>
    <div class="panel-b" style="border-top:1px solid var(--line)"><p class="hint">行尾按钮只把问题填进右侧输入框，不会自动发送——和参考门户的 <code>onAskAssistant</code> 一致。</p></div>
  </div>

  <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>护栏配置</h3><span class="aside">merchant_agent/config.py 默认值</span></div>
      <div class="panel-b ctl">
        ${[['price','单次调价幅度上限','max_price_delta_pct',1,50,'%'],['promo','促销折扣深度上限','max_promotion_discount_pct',5,90,'%'],['restock','单次补货数量上限','max_restock_quantity',10,500,' 件']].map(([key, label, cfg, min, max, unit]) => `
          <div class="ctl-row"><label for="g-${key}">${label}</label><output id="o-${key}">${G[key]}${unit}</output><span class="k">${cfg}</span>
          <input type="range" id="g-${key}" min="${min}" max="${max}" value="${G[key]}" data-bind="am-g" data-key="${key}" data-unit="${unit}"></div>`).join('')}
        <label class="switch"><input type="checkbox" id="g-host" data-bind="am-host" ${G.host ? 'checked' : ''}> 需要宿主审批 <code>require_host_approval</code></label>
        <p class="hint">护栏在暂存时跑一次，<b>应用时按当时配置再跑一次</b>。试试：先让 Agent 暂存 52 件补货，再把补货上限拖到 40，然后点批准。</p>
      </div>
    </div>
    <div class="panel"><div class="panel-h"><h3>改动记录</h3><span class="aside">stage_* → 预览 → 宿主批准 → 应用</span></div>${changeRowsHTML('am')}</div>
  </div>`;
}

  <div class="grid2">

function renderSM(){
  const alertTag = p => {
    if (p.status === 'ARCHIVED') return '<span class="tag">不进目录</span>';
    const k = smKind(p);
    if (!p.tracks) return '<span class="tag">不跟踪库存</span>';
    if (k === 'low_stock') return `<span class="tag warn">低库存 ≤ ${smThreshold(p)}</span>`;
    if (k === 'slow_mover') return '<span class="tag">滞销</span>';
    return '<span class="tag ok">正常</span>';
  };
  const status = s => ({ACTIVE:'<span class="tag ok">ACTIVE</span>', DRAFT:'<span class="tag warn">DRAFT</span>', ARCHIVED:'<span class="tag">ARCHIVED</span>'}[s]);
  const src = SOURCE_NOTES[SM.metricSource];
  const writes = SM.mutations.filter(m => m.kind !== 'query').length;
  return `
  <div class="panel"><div class="panel-b hello">
    <div><h2>ACME Supply Co.</h2><p>这个示例<b>只有 API</b>（<code>/api/merchant</code>），不带操作台界面；下面是按它的路由补画的。</p></div>
    <span class="tag mono">store_kind: ${SM.storeKind === 'local' ? 'local' : 'shopify'}</span>
  </div>
  <div class="panel-b" style="border-top:1px solid var(--line);display:grid;gap:12px">
    <div style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center">
      <label class="switch">店铺 <select id="sm-store" data-bind="sm-store"><option value="local" ${SM.storeKind === 'local' ? 'selected' : ''}>本地模拟店 SHOPIFY_LOCAL_STORE=1</option><option value="dev" ${SM.storeKind === 'dev' ? 'selected' : ''}>Shopify 开发店</option></select></label>
      <label class="switch">指标来源 <select id="sm-src" data-bind="sm-src">
        ${[['shopifyql','ShopifyQL + 会话'],['shopifyql_nosessions','ShopifyQL，无会话'],['scan_disabled','订单扫描（配置关闭 ShopifyQL）'],['scan_unavailable','订单扫描（缺 read_reports）']].map(([v, l]) => `<option value="${v}" ${SM.metricSource === v ? 'selected' : ''} ${SM.storeKind === 'local' && v === 'shopifyql' ? 'disabled' : ''}>${l}</option>`).join('')}
      </select></label>
    </div>
    <div class="note-box">Agent 收到的来源说明：${esc(src.zh)}<span class="en">source_note: "${esc(src.en)}"</span></div>
  </div></div>

  <div class="panel"><div class="panel-h"><h3>目录（seed.json 的 8 个商品）</h3><span class="aside">改「近 30 天销量」，告警按 alerts.py 的规则即时重算</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>商品</th><th>状态</th><th>变体 · 价格 · 成本</th><th>库存</th><th>近 30 天销量</th><th>告警</th></tr></thead>
      <tbody>${SM.products.map(p => `<tr class="${p.status === 'ARCHIVED' ? 'archived' : ''}">
        <td><b style="font-weight:500">${esc(p.zh)}</b> <span class="mono" style="color:var(--ink-3)">${p.handle}</span><span class="sub">${esc(p.why)}</span></td>
        <td>${status(p.status)}<span class="sub">${esc(p.type)}</span></td>
        <td>${p.variants.map(v => `<div>${esc(v.t)} · ${usd(v.price)} · ${v.cost == null ? '<span class="warn" style="color:var(--warn)">无成本</span>' : usd(v.cost)}</div>`).join('')}</td>
        <td>${p.tracks ? smStock(p) : '—'}</td>
        <td>${p.status === 'ARCHIVED' ? '—' : `<input type="number" min="0" max="99" id="sold-${p.handle}" value="${p.sold30}" data-bind="sm-sold" data-id="${p.handle}" aria-label="${esc(p.zh)} 近 30 天销量">`}</td>
        <td>${alertTag(p)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="panel-b" style="border-top:1px solid var(--line)"><p class="hint">规则：库存 ≤ 阈值（按 handle → 按类型：Workshop tools 12、Storage 6）为低库存；否则库存 ≥ 12 且 30 天销量 ≤ 2 为滞销。未跟踪库存不报警；归档商品不加载。销量取种子订单，本地模拟店会在其后补出更长的历史，所以实际运行的数字可能不同。</p></div>
  </div>

  <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>暂存改动</h3><span class="aside">唯一应用入口：POST /changes/{id}/apply</span></div>
      ${changeRowsHTML('sm')}
      <div class="panel-b" style="border-top:1px solid var(--line)">
        <label class="switch">应用补货时的库存情况 <select id="sm-move" data-bind="sm-move">
          <option value="none" ${SM.stockMove === 'none' ? 'selected' : ''}>和暂存时一样</option>
          <option value="sold" ${SM.stockMove === 'sold' ? 'selected' : ''}>暂存后又卖出 1 件</option>

      <div class="ledger">${SM.mutations.length ? SM.mutations.map(m => `<div class="ln"><span class="${m.kind === 'rejected' ? 'rej' : m.kind === 'ok' ? 'okc' : 'dim'}">${m.kind === 'query' ? 'query' : 'mutation'} ${esc(m.op)}</span> <span class="dim">${esc(m.vars)}</span></div>`).join('') : '<div class="ln dim"># 暂存路径不发送任何 mutation。批准并应用一份改动后，这里才会出现写调用。</div>'}</div>
    </div>
  </div>

  <div class="panel"><div class="panel-h"><h3>凭据</h3><span class="aside">merchant/api/admin_token.py</span></div>
    <div class="panel-b"><p class="hint" style="color:var(--ink-2)">开发店用 client ID + secret 在首次请求时铸造 24 小时的 Admin token，过期再铸（加锁，冷启动只铸一次）；遇到 401 重铸并重试一次。token 只存在这一个对象里：不进模型、不经路由返回、不写日志、不出现在错误消息里。本地模拟店不需要任何账号或 token。</p></div>
  </div>`;
}

function renderApp(){
  const k = cur();
  const html = {am:renderAM, as:renderAS, sm:renderSM, ss:renderSS}[k]();
  const active = document.activeElement;

function renderEventsCount(){
  const n = $('#ev-n'); if (n) n.textContent = sess(cur()).events.length;
  if (UI.tab[cur()] === 'events') renderEvents();
}
function renderEvents(){
  const el = $('#events'); if (!el) return;
  const evs = sess(cur()).events;
  el.innerHTML = evs.length ? evs.map(e => e.type === '#'
    ? `<div class="frame"><span class="c">: ${esc(e.data)}</span></div>`
    : `<div class="frame"><span class="e">event:</span> ${esc(e.type)}\n<span class="e">data:</span> <span class="s">${esc(JSON.stringify(e.data))}</span></div>`).join('')
    : '<div class="frame"><span class="c">: 还没有事件。发起一轮对话后，这里按 commerce_common/streaming.py 的帧格式逐条出现；以冒号开头的是宿主侧注释行（SSE comment），不是模型事件。</span></div>';

function matchScript(k, text){
  const t = text.trim();
  const list = SCRIPTS[k];
  const exact = list.find(x => x.text === t);
  if (exact) return exact;
  const rules = {
    am: [[/早上|处理什么|今天/, 'm1'], [/补货|补够|墙贴/, 'm2'], [/批准/, 'm3'], [/折|促销|清仓/, 'm4'], [/销售|波动|品类/, 'm5']],
    as: [[/帐篷|露营/, 's1'], [/比较|对比/, 's2'], [/退货|购物车/, 's3'], [/AR-1007|扫地/, 's4'], [/记住|记一下|卡号/, 's5'], [/结账/, 's6'], [/评论/, 's7']],
    sm: [[/早上|今天/, 'b1'], [/挡块|补一个月/, 'b2'], [/批准/, 'b3'], [/涨价|踏步凳/, 'b4'], [/扫帚/, 'b5'], [/毛利|直角尺/, 'b6']],
    ss: [[/礼物|推荐/, 'u1'], [/加进|加入|第一个/, 'u2'], [/退货|退款/, 'u3'], [/订单/, 'u4'], [/结账/, 'u5']]
  }[k];
  const hit = (rules || []).find(([re]) => re.test(t));
  return hit ? list.find(x => x.id === hit[1]) : null;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, k = cur();
  if (act === 'project'){ UI.project = id; renderAll(); }
  else if (act === 'surface'){ UI.surface[UI.project] = id; renderAll(); }
  else if (act === 'atab'){ UI.tab[k] = id; renderAgent(); }
  else if (act === 'run'){ UI.tab[k] = 'chat'; runScript(k, id); }
  else if (act === 'approve') hostApply(id);
  else if (act === 'discard') hostDiscard(id);
  else if (act === 'filter'){ AM.filter = id; renderApp(); }
  else if (act === 'ask'){
    UI.draft[k] = b.dataset.text; UI.tab[k] = 'chat'; renderAgent();
    const input = $('#composer-input'); input.focus(); input.setSelectionRange(input.value.length, input.value.length);
  }
  else if (act === 'as-add'){
    const l = AS.cart.find(x => x.id === id && x.by === '按钮');
    if (l) l.qty += 1; else AS.cart.push({id, qty:1, by:'按钮'});
    route('as', `宿主按钮路由：加入购物车 ${id}（不经模型，不走模型写入闸门）`);
    ev('as', 'cart_update', {cart:{lines:AS.cart.map(x => ({product_id:x.id, quantity:x.qty}))}});
    renderApp();
  }
  else if (act === 'as-forget'){ const f = AS.memory.splice(Number(id), 1)[0]; route('as', `记忆删除路由：${f.key}`); renderApp(); }
  else if (act === 'handoff' || act === 'ss-handoff'){ toast(k === 'ss' ? '沙盘里不跳转。真实示例在这里打开店铺的 continue_url，运费和支付都在 Shopify 页面完成。' : '沙盘里不跳转。真实示例由宿主应用在自己的结账页完成下单，仓库里没有任何支付处理。'); }
  else if (act === 'ss-signin'){
    if (!SS.credsConfigured){ route('ss', 'POST 登录路由 → 503：未配置 SHOPIFY_UCP_CLIENT_ID / SECRET，按访客处理'); toast('登录路由返回 503：没有配置 Shop 凭据，会话保持访客身份。先在「部署配置」里勾选凭据。'); }
    else { SS.signedIn = true; route('ss', 'Sign in with Shop：服务端授权码流程完成，买家 token 按会话存于服务端'); renderApp(); }
  }
  else if (act === 'ss-attach'){
    SS.cart.id = 'cart_aHR0cHM6…'; SS.cart.attached = true;
    if (!SS.cart.lines.find(l => l.id === 'p-mug')) SS.cart.lines.push({id:'p-mug', qty:2});
    route('ss', 'POST /api/cart/attach：接入店铺已有购物车（其中已有 2 个马克杯）；之后每次写入前先重读');
    renderApp();
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'composer') return;
  e.preventDefault();
  const k = cur(), input = $('#composer-input'), text = input.value.trim();
  if (!text) return;
  UI.draft[k] = '';
  const sc = matchScript(k, text);
  if (sc){ runScript(k, sc.id, text); return; }
  push(k, {t:'user', text});
  push(k, {t:'sys', html:'沙盘只回放预设流程，没有接模型。试试下面的预设提问，或换个说法（比如带上“补货”“批准”“结账”）。'});
  renderAgent();
});

document.addEventListener('change', e => {

  else if (bind === 'ss-scope'){ SS.orderScope = t.checked; }
  else if (bind === 'sm-sold') renderApp();
});

const baseGuardrails = guardrails;
guardrails = function(ch, G){
  const errors = baseGuardrails(ch, G);
  if (ch.kind === 'campaign' && ch.budget > 10000) errors.push('活动预算超过上游默认上限 10,000');
  if (ch.items.length > 25) errors.push('单次变更超过 25 项');
  return errors;
};
const baseApplyAm = applyAm, baseApplySm = applySm;
applyAm = function(ch){
  if (ch.kind === 'campaign') {
    ch.status='applied'; ch.result='营销草稿已记录（模拟），未投放广告。';
    LAB.campaigns.am.push({title:ch.headline, budget:ch.budget}); return;
  }
  baseApplyAm(ch);
};
applySm = async function(ch){
  if (ch.kind === 'campaign' || ch.kind === 'promotion') {
    ch.status='applied'; ch.result='仅记录决策；未创建 Shopify 折扣、未投放广告，写调用数不增加。';
    if(ch.kind === 'campaign') LAB.campaigns.sm.push({title:ch.headline,budget:ch.budget});
    return;
  }
  await baseApplySm(ch);
};

async function stageExtra(k,c,kind){
  const budget=LAB.budget[k], depth=LAB.discount[k];
  const isCampaign=kind==='campaign';
  await c.tool(isCampaign?'get_campaign_performance':'get_pricing_context',{},()=>({summary:'读取模拟记录与当前约束'}));
  const spec={kind,target:k==='sm'?'cast-iron-hold-down':'AR-1804',budget,depth,
    headline:isCampaign?'周末上新 · 营销草稿':'限时促销 · '+depth+'% 折扣',
    summary:isCampaign?'面向近期浏览未购买的顾客，准备一组商品推荐文案。':'为选定商品准备促销价格。',
    note:k==='sm'?'批准只记录决策，不创建店铺折扣或投放广告。':'示意活动；批准后只更新本页记录。',
    items:[{label:isCampaign?'周末上新':'选定商品',field:isCampaign?'budget':'discount_pct',before:0,after:isCampaign?budget:depth}]};
  const G={...(k==='am'?AM.G:SM.G),promo:k==='am'?AM.G.promo:50};
  const result=await c.tool(isCampaign?'stage_campaign':'stage_promotion',isCampaign?{budget}:{discount_pct:depth},()=>{
    const errors=guardrails(spec,G);
    if(errors.length) return {status:'blocked',gate:'guardrail',summary:errors.join('；')};
    const ch=makeChange(k,spec); c.ev('change_update',{change:{change_id:ch.id,status:ch.status,kind}});
    return {summary:'草稿已暂存，等待批准',change:ch};
  });
  if(result.change)c.ui('present_change_preview',{kind:'change',id:result.change.id});
}

  for(const role of ['buyer','merchant']){
    const k=name+'-'+role;

    addScenario(k,'overview',role==='buyer'?v.buyer:v.merchant,async c=>{
      await c.tool(role==='buyer'?'search_products':'get_business_snapshot',{},()=>({summary:'读取'+v.label+'示意数据'}));
      info(c,v.label+' · '+(role==='buyer'?v.buyer:v.merchant),role==='buyer'?v.guide:['可用 '+v.stock+' '+v.unit,'当前基础价格 '+usd(v.price),'分析结果为示意，写入先预览再确认。']);
    });
    if(role==='merchant') addScenario(k,'stage','预览'+(name==='entertainment'?'释放保留票':'调价 10%'),async c=>{
      v.pending=name==='entertainment'?{before:v.stock,after:v.stock+4}:{before:v.price,after:Math.round(v.price*110)/100};

    if(role==='buyer') addScenario(k,'guide','查看完整步骤',async c=>info(c,v.label+'步骤',v.guide));
  }
}

    '<p>本页已批准活动：'+LAB.campaigns[k].length+' 项</p>';
  if(k==='ss')fields='<div class="lab-fields"><button class="btn" data-lab="signout">退出 Shop 登录</button><button class="btn" data-lab="complete-order">模拟店铺完成结账</button></div><p class="hint">订单需先由本页结账关联；仅勾选权限不会凭空产生订单。</p>';
  if(k.startsWith('travel-'))fields='<div class="lab-fields"><label>入住 <input type="date" style="width:145px" data-lab-field="arrival" value="'+esc(LAB.arrival)+'"></label><label>晚数 <input type="number" min="1" max="14" data-lab-field="nights" value="'+LAB.nights+'"></label></div>';
  if(k.startsWith('telecom-'))fields='<div class="lab-fields"><label>套餐 <select data-lab-field="plan"><option value="basic">基础套餐</option><option value="family">家庭套餐</option></select></label><label>线路 <input type="number" min="1" max="8" data-lab-field="lines" value="'+LAB.lines+'"></label></div>';
  return (['as','ss'].includes(k)?cartEditor(k):'')+'<div class="panel"><div class="panel-h"><h3>场景目录</h3><span class="aside">点选即可体验</span></div><div class="panel-b">'+offlineNote+fields+'<div class="scenario-grid">'+buttons+'</div></div></div>';
}
const oldRenderApp=renderApp;
renderApp=function(){
  const k=cur(), name=k.split('-')[0], v=VERTICALS[name];
  if(v){
    $('#app').innerHTML='<div class="panel"><div class="panel-h"><h3>'+v.label+' · '+(k.endsWith('buyer')?'顾客':'商家')+'</h3><span class="tag">示意数据</span></div><div class="panel-b"><p>可用 '+v.stock+' '+v.unit+' · 基础价格 '+usd(v.price)+'</p><p>'+v.items.join(' / ')+'</p>'+
      (name==='telecom'?'<p>固定受保护费用：每条线路 5；总价 '+usd(v.price+5)+'。</p>':'')+
      (name==='entertainment'?'<p>保留票：'+(v.hold?'2 张':'无')+' · 候补：'+(v.waitlist?'已登记':'未加入')+' · 转赠：'+(v.transferred?'已完成':'未操作')+'</p><button class="btn" data-lab="expire">模拟保留过期</button>':'')+
      (v.pending&&k.endsWith('merchant')?'<div class="note-box">待批准：'+v.pending.before+' → '+v.pending.after+' <button class="btn primary" data-lab="vertical-approve">批准并应用</button> <button class="btn" data-lab="vertical-discard">丢弃</button></div>':'')+'</div></div>';
  }else oldRenderApp();
  $('#app').insertAdjacentHTML('beforeend',extras(k));
  const fault=$('[data-lab-field="fault"]');if(fault)fault.value=LAB.fault;
  const plan=$('[data-lab-field="plan"]');if(plan)plan.value=LAB.plan;
};

// Order reads require both credentials and a session-associated checkout.
const orderScript=SCRIPTS.ss.find(s=>s.id==='u4');
orderScript.run=async c=>{
  await c.tool('get_orders',{},()=>({summary:!SS.credsConfigured?'没有应用凭据，查询返回空':!SS.orderScope?'缺少权限，查询返回空':!LAB.ordersReady?'没有当前会话关联订单':'示意订单 #1042：已发货'}));
  if(SS.credsConfigured&&SS.orderScope&&LAB.ordersReady)c.ui('present_order_status',{kind:'ss-order'});
  else info(c,'暂时没有可展示的订单',['工具仍然存在；凭据、权限和本会话订单关联必须满足。','可查看下单确认邮件获取物流信息。']);
};

const originalPatterns=renderPatterns;
renderPatterns=function(){
  originalPatterns();
  $('#patterns').insertAdjacentHTML('beforeend','<details class="panel coverage"><summary>覆盖范围与实现层级</summary><div class="panel-b"><p>所有数据和状态均在浏览器内，刷新重置。事件字段用于学习；卡片 payload 为缩减示意，不可作为 API 契约。</p><div class="tbl-wrap"><table><tr><th>范围</th><th>本页展示</th><th>边界</th></tr><tr><td>零售商家与购物</td><td>原场景 + 活动、趋势、计划、指南、购物车编辑、订单</td><td>预设脚本，无自由推理</td></tr><tr><td>旅行 / 电信 / 票务</td><td>顾客与商家代表流程，预览审批、票务保留与释放</td><td>新增示意数据，不是完整行业系统</td></tr><tr><td>Shopify</td><td>权限、降级、促销决策、错误恢复、会话订单</td><td>不调用 GraphQL / UCP</td></tr><tr><td>Messages API / Agent SDK / Managed Agents</td><td>上游三种运行方式；此处统一用脚本模拟</td><td>不运行 SDK、MCP 或调度服务</td></tr><tr><td>工程能力</td><td>事件结构、渐进卡片、重试说明</td><td>缓存、压缩、部署、eval、脚手架仅作为阅读方向，不伪装成页面功能</td></tr></table></div><p>上游源码：<a href="https://github.com/anthropics/commerce-agents/tree/fd4d59224ab96b43c6dc6888207c67b3bd5a24cf" target="_blank" rel="noreferrer">Anthropic 固定版本</a> · <a href="https://github.com/Shopify/claude-for-commerce-examples/tree/d68c7fa24f26ab138d8b4ccdd0488db140a6bfe6" target="_blank" rel="noreferrer">Shopify 固定版本</a></p><button class="btn" data-lab="reset">重置整个沙盘</button></div></details>');
};
document.addEventListener('change',e=>{
  const key=e.target.dataset.labField;if(!key)return;
  if(key==='budget'||key==='discount'){
    const value=Number(e.target.value);LAB[key][cur()]=Number.isFinite(value)?Math.max(0,value):0;
  }else if(key==='nights'||key==='lines') LAB[key]=Math.min(key==='nights'?14:8,Math.max(1,Math.floor(Number(e.target.value)||1)));
  else LAB[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;
});
document.addEventListener('click',e=>{
  const button=e.target.closest('[data-lab]');if(!button)return;
  const action=button.dataset.lab,k=cur();
  if(action==='reset'){location.reload();return;}
  if(action==='retry-partial'){
    if(!LAB.batchPartial){toast('没有待重试的失败项');return;}
    LAB.batchPartial=false;button.disabled=true;button.textContent='失败项已重试成功';
    push('sm',{t:'sys',html:'模拟批次已完成：保留第一项结果，第二项重试成功。'});return;
  }
  if(action==='cart'){
    const lines=k==='as'?AS.cart:SS.cart.lines, index=Number(button.dataset.index), line=lines[index];if(!line)return;
    const delta=button.dataset.delta;
    if(delta==='remove'||line.qty+Number(delta)<=0)lines.splice(index,1);
    else if(line.qty+Number(delta)>24){toast('每项最多 24 件');return;}
    else line.qty+=Number(delta);
    if(k==='ss')SS.checkoutStaged=lines.length>0;
    ev(k,'cart_update',{cart:{lines:lines.map(l=>({product_id:l.id,quantity:l.qty}))}});
    renderApp();renderTranscript();
  }else if(action==='signout'){SS.signedIn=false;toast('已退出本页模拟登录');renderApp();}
  else if(action==='complete-order'){
    if(!SS.cart.lines.length){toast('先添加商品，再模拟结账');return;}
    LAB.ordersReady=true;toast('模拟店铺已完成结账，订单已关联当前会话');
  }else if(action==='expire'){
    const v=VERTICALS.entertainment;if(v.hold){v.stock+=2;v.hold=false;toast('保留已过期，两张票释放回库存');}else toast('当前没有保留票');renderApp();
  }else if(action==='vertical-approve'||action==='vertical-discard'){
    const name=k.split('-')[0],v=VERTICALS[name];if(!v||!v.pending)return;
    if(action==='vertical-approve'){if(name==='entertainment')v.stock+=4;else v.price=v.pending.after;toast('已应用到本页模拟数据');}
    v.pending=null;renderApp();
  }
});
renderAll();
})();
</script>
